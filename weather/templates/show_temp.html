<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather</title>
</head>
<body>
    <h1>سایت نمایش دمای هوا</h1>
    {% if temp %}
       <h2>{{city}} : {{temp}} درجه سانتی گراد</h2>
    {% else %}
        <h2>خطا در دریافت دما</h2>
    {% endif %}
</body>
</html>
